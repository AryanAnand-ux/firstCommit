<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c1226" />
  <meta name="description" content="RaktaSetu — AI-powered emergency blood &amp; platelet donor network for India. Find matching donors in minutes, not hours." />
  <title>RaktaSetu — Blood donor network for India</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e1374b"/>
              <stop offset="1" stop-color="#7c1226"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="18" fill="url(#bm)"/>
          <path d="M32 8c6.5 8.6 12.5 15 12.5 24.5A12.5 12.5 0 1 1 19.5 32.5C19.5 23 25.5 16.6 32 8Z" fill="#fffdf9"/>
          <path d="M32 20c2.7 4.7 5.3 8 5.3 12.3a5.3 5.3 0 1 1-10.6 0C26.7 28 29.3 24.7 32 20Z" fill="#e1374b"/>
        </svg>
        <span class="brand-word">Rakta<b>Setu</b></span>
        <span class="brand-tag">the blood bridge</span>
      </a>
      <nav class="nav">
        <button data-nav="#/">Home</button>
        <button data-nav="#/requests">Requests</button>
        <button data-nav="#/donor">Donor</button>
        <button data-nav="#/alerts">Alerts</button>
        <button data-nav="#/assistant">Assistant</button>
      </nav>
      <span class="user-chip" id="userChip"></span>
      <button class="auth-pill" id="authBtn">Sign in</button>
    </div>
  </header>

  <main id="app"><div class="boot-screen"><span class="boot-mark"></span><span class="boot-line"></span></div></main>

  <footer>
    <div class="wrap footer-inner">
      <span class="foot-brand"><b>RaktaSetu</b> · the blood bridge</span>
      <span>First Commit 2026 · Bharat Builds Tour · built on AWS</span>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.13/dist/amazon-cognito-identity-js.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
